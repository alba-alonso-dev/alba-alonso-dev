name: Generate profile assets

# Genera todas las imágenes del perfil (snake + skyline) en un único job y las
# publica juntas en la rama `output`. Antes eran dos workflows y el del snake
# hacía force-push a `output`, borrando el SVG del skyline cada día.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-assets.yml"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate contribution skyline
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          plugin_skyline: yes
          plugin_skyline_frames: 6
          plugin_skyline_quality: 1
          filename: github-skyline.svg
          output_action: none

      - name: Collect skyline render
        run: sudo cp /metrics_renders/github-skyline.svg dist/

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update profile assets [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
